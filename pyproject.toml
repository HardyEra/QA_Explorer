[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/app"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "backend/generated",
    "backend/logs",
    "backend/runtime",
    "backend/screenshots",
    "backend/uploads",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
